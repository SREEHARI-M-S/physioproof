[project]
name = "physioproof"
version = "0.1.0"
description = "Physiological evidence for deepfake detection from video"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sreehari" }]
dependencies = [
    "numpy>=2.0",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["mypy>=1.11", "pytest>=8.3", "ruff>=0.6"]
cv = ["opencv-python-headless>=4.10"]

[project.scripts]
physioproof = "physioproof.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["physioproof"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["physioproof"]

[tool.pytest.ini_options]
testpaths = ["tests"]
